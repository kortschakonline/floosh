# Baut floosh auf einem macOS-Runner und veröffentlicht das GitHub-Release
# mit DMG — dasselbe wie Tools/release.sh, nur ohne eigenen Mac.
#
#   Manuell:  Actions → Release → „Run workflow" (veröffentlicht die Version
#             aus VERSION und setzt den Tag selbst)
#   Per Tag:  git tag -a v1.2.3 -m "floosh 1.2.3" && git push origin v1.2.3
#             (Tag muss zu VERSION passen)
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-Nummer = Anzahl Commits (bundle-app.sh) — volle History nötig
          fetch-depth: 0

      - name: Version prüfen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION ($VERSION)"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG existiert bereits — VERSION erhöhen"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Xcode
        run: |
          xcodebuild -version
          swift --version

      # Developer ID aus den Repository-Secrets in einen eigenen Schlüsselbund
      # laden. Fehlen die Secrets, baut der Workflow wie bisher ad hoc signiert.
      #   DEVELOPER_ID_P12           Zertifikat „Developer ID Application“ als .p12, base64
      #   DEVELOPER_ID_P12_PASSWORD  Passwort der .p12
      #   NOTARY_APPLE_ID            Apple-ID für die Beglaubigung
      #   NOTARY_PASSWORD            App-spezifisches Passwort dieser Apple-ID
      #   NOTARY_TEAM_ID             Team-ID (10 Zeichen, developer.apple.com → Membership)
      - name: Signatur einrichten
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::notice::Keine Developer ID hinterlegt — Build wird ad hoc signiert"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::Kein Zertifikat „Developer ID Application“ in DEVELOPER_ID_P12"
            exit 1
          fi
          echo "Signiere mit: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: DMG bauen
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: ./Tools/make-dmg.sh

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          DMG="build/floosh-$VERSION.dmg"
          NOTES="docs/releases/$VERSION.md"
          [[ -f "$DMG" ]] || { echo "::error::$DMG fehlt"; exit 1; }
          if [[ -f "$NOTES" ]]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          # Ohne vorhandenen Tag legt gh ihn auf dem gebauten Commit an
          gh release create "$TAG" "$DMG" --title "floosh $VERSION" \
            --target "$GITHUB_SHA" "${NOTES_ARGS[@]}"
          echo "### ✓ floosh $VERSION veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Schlüsselbund entfernen
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
